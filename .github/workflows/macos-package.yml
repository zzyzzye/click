name: macOS 安装包
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  package:
    name: 构建 macOS ARM64 安装包
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: 检出源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: 准备 Qt 6.8.3
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: '6.8.3'
          host: mac
          target: desktop
          arch: clang_64
          cache: true
      - name: 构建、测试并打包
        run: bash scripts/build-macos-release.sh
      - name: 上传安装包
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ClickFlow-macOS-arm64
          path: |
            dist/macos-arm64/*.dmg
            dist/macos-arm64/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
