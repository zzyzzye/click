name: 版本发布草稿

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: 检查版本与中文发布说明
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python3 scripts/validate-release.py "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.ref_name }}

  package:
    needs: validate
    uses: ./.github/workflows/package-all.yml

  draft:
    name: 上传安装包到草稿 Release
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: 下载本次运行的五份产物
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ClickFlow-*
          path: release-assets
          merge-multiple: true
      - name: 核对产物并创建草稿
        run: bash scripts/create-release-draft.sh "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
